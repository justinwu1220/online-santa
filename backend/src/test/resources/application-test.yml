spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  storage:
    public-bucket: test-public
    # 測試涵蓋整條示意圖路徑，這裡一律開啟；正式環境的預設是關閉
    wish-image-enabled: true
    private-bucket: test-private
    upload-url-ttl: 15m
    download-url-ttl: 10m
    max-upload-bytes: 5242880
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/webp
    local-storage-dir: ./target/test-storage
  auth:
    # 測試用的 Firebase 專案 ID，須與 TestJwtSupport 簽出的 token 一致
    firebase-project-id: online-santa-test
    admin-emails: platform-admin@example.com
    allowed-origins: http://localhost:5173

logging:
  level:
    org.testcontainers: WARN
    com.github.dockerjava: WARN
