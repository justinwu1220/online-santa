spring:
  application:
    name: online-santa-api
  profiles:
    default: local
    # 啟用 local 時一併啟用 dev-auth：本機可用 X-Dev-User-Email 標頭模擬身分，
    # 免去每次 curl 都得先跑完瀏覽器登入流程取得真實 ID token。
    # prod 不在這個群組裡，AuthConfigurationGuard 啟動時還會再檢查一次。
    group:
      # 本機一併啟用開發用的身分模擬與本地檔案儲存，
      # 讓沒有 Firebase 與 GCP 專案的人也能把整個流程跑起來。
      local: dev-auth,dev-storage
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # schema 一律由 Flyway 管理
    properties:
      hibernate:
        jdbc.time_zone: UTC
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  threads:
    virtual:
      enabled: true              # Java 21 虛擬執行緒，提升搶領尖峰的吞吐

server:
  port: 8080
  shutdown: graceful             # Cloud Run 縮容時不中斷處理中的請求
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true            # 提供 /actuator/health/liveness | readiness

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  claim:
    # 供給小於需求時的公平性機制：每位民眾同時進行中的認領上限
    max-active-per-donor: 3
    # 機構選 AUTO 政策時的預設寬限天數（機構可自行調整）
    default-release-after-days: 7
  storage:
    # 依敏感度分成兩個 bucket：示意圖公開可讀（願望牆流量大，省下每張圖的簽章往返），
    # 寄送證明與回饋照片一律需要限時簽章才能讀取。
    public-bucket: ${GCS_PUBLIC_BUCKET:online-santa-public}
    # 願望示意圖目前關閉：願望牆改以分類圖示呈現，公開 bucket 因此不必存在，
    # 也就沒有它的出網流量。要開啟見 docs/DEPLOY.md 的「日後啟用願望示意圖」。
    wish-image-enabled: ${WISH_IMAGE_ENABLED:false}
    private-bucket: ${GCS_PRIVATE_BUCKET:online-santa-private}
    upload-url-ttl: 15m
    download-url-ttl: 10m
    max-upload-bytes: 5242880          # 5 MB
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/webp
    # 僅 dev-storage profile 使用
    local-storage-dir: ${LOCAL_STORAGE_DIR:./.local-storage}
  internal-jobs:
    # Cloud Scheduler 的 OIDC token 必須以本服務網址為 audience，
    # 且由指定的服務帳號簽發，兩者缺一不可。
    audience: ${INTERNAL_JOB_AUDIENCE:http://localhost:8080}
    scheduler-service-account: ${SCHEDULER_SERVICE_ACCOUNT:scheduler@example.iam.gserviceaccount.com}
  auth:
    # Firebase 專案 ID。ID token 的 issuer 與 audience 都由它推導，
    # 少了 audience 檢查，任何 Firebase 專案簽出的 token 都會被接受。
    firebase-project-id: ${FIREBASE_PROJECT_ID:}
    # 白名單內的 email 於登入時取得 ADMIN 角色
    admin-emails: ${APP_ADMIN_EMAILS:}
    allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:5173}
  notification:
    # 不綁定特定供應商——任何符合 SMTP 的服務都能填進這五個值。host 留空時
    # MailConfig 不會建立 JavaMailSender，NotificationService 自動降級為
    # no-op（只記 log，不寄信），本機開發與尚未申請 SMTP 的環境都不受影響。
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from-address: ${MAIL_FROM:no-reply@example.org}
    # 信件內文的連結要指向前端，不是這支 API 自己的網址
    public-url: ${APP_PUBLIC_URL:http://localhost:5173}
