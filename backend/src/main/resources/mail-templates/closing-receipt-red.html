<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>5.1 捐贈收據（紅聯）</title>
  <style>
    body { max-width: 760px; margin: 32px auto; padding: 0 20px; color: #222; font: 16px/1.65 Arial, "PingFang TC", sans-serif; }
    header { border-bottom: 1px solid #ddd; margin-bottom: 20px; padding-bottom: 14px; }
    header small { color: #555; }
    h1 { margin: 6px 0 0; font-size: 20px; line-height: 1.5; }
  </style>
</head>
<body>
  <!-- 文案已於 2026-11-19 由使用者確認。欄位由結案寄送流程填入。 -->
  <template id="email-subject">【線上聖誕老人 2026】您的捐贈收據（{{receiptNo}}）</template>
  <template id="email-body">
    <div lang="zh-Hant-TW" style="font-family:Arial,'PingFang TC','Microsoft JhengHei',sans-serif;font-size:16px;line-height:1.65;color:#222;">
      <p style="margin:0 0 16px;">親愛的{{recipientName}}，您好：</p>
      <p style="margin:0 0 12px;"><strong style="color:#a61c00;">謝謝您為孩子準備的禮物！</strong></p>
      <p style="margin:0 0 12px;">您在線上聖誕老人捐贈的「{{giftDescription}}」，已由{{organizationName}}收到。依您申請收據的需求，隨信附上<strong>捐贈收據（紅聯）</strong>，收據編號為 {{receiptNo}}。</p>
      <p style="margin:0 0 12px;">這份收據可作為您的捐贈證明；如需用於報稅，請妥善保存，並依主管機關規定辦理。</p>
      <p style="margin:0 0 20px;">收據上的資料若有錯誤，請直接回覆這封信告訴我們，團隊會協助更正並重新開立。</p>
      <p style="margin:0 0 20px;"><strong style="color:#38761d;">祝您有一個溫暖的聖誕節！ 🎄</strong></p>
      <p style="margin:0;">Best wishes,<br>線上聖誕老人團隊</p>
    </div>
  </template>

  <header>
    <small>5.1 捐贈收據（紅聯）｜信件預覽（使用虛構資料）</small>
    <h1 id="subject"></h1>
  </header>
  <main id="preview"></main>
  <script>
    const example = { recipientName: '小晴', giftDescription: '一盒 48 色的色鉛筆', organizationName: '星星小學', receiptNo: 'OS2026-000001' };
    const fillExample = text => text.replace(/{{(\w+)}}/g, (token, key) => example[key] ?? token);
    document.getElementById('subject').textContent =
      fillExample(document.getElementById('email-subject').content.textContent);
    const preview = document.getElementById('email-body').content.cloneNode(true);
    const walker = document.createTreeWalker(preview, NodeFilter.SHOW_TEXT);
    while (walker.nextNode()) walker.currentNode.textContent = fillExample(walker.currentNode.textContent);
    document.getElementById('preview').append(preview);
  </script>
</body>
</html>
