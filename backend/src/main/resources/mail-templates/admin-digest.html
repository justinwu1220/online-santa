<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>4.8 管理員每日待審摘要</title>
  <style>
    body { max-width: 760px; margin: 32px auto; padding: 0 20px; color: #222; font: 16px/1.65 Arial, "PingFang TC", sans-serif; }
    header { border-bottom: 1px solid #ddd; margin-bottom: 20px; padding-bottom: 14px; }
    header small, #link-note { color: #555; }
    h1 { margin: 6px 0 0; font-size: 20px; line-height: 1.5; }
  </style>
</head>
<body>
  <!-- 工程套用與欄位對照請見同資料夾「第四項_工程欄位對照.md」。 -->
  <template id="email-subject">【線上聖誕老人 2026】今日待審｜機構 {{orgCount}} 件、願望 {{wishCount}} 件、解除凍結 {{wishUnlockCount}} 件、解除停權 {{orgUnlockCount}} 件</template>
  <template id="email-body">
    <div lang="zh-Hant-TW" style="font-family:Arial,'PingFang TC','Microsoft JhengHei',sans-serif;font-size:16px;line-height:1.65;color:#222;">
      <p style="margin:0 0 16px;">團隊夥伴，您好：</p>
      <p style="margin:0 0 16px;">截至 <strong>{{asOf}}（臺灣時間）</strong>，後台共有 <strong>{{totalCount}} 件</strong>待審。點選審核項目，就能前往對應的清單。</p>
      <table style="border-collapse:collapse;width:100%;max-width:520px;margin:0 0 16px;font-size:15px;">
        <thead><tr><th scope="col" style="text-align:left;padding:7px 5px;background:#eff4ec;">審核項目</th><th scope="col" style="text-align:left;padding:7px 5px;background:#eff4ec;">待審件數</th><th scope="col" style="text-align:left;padding:7px 5px;background:#eff4ec;">最久已等候</th></tr></thead>
      <tbody>
        <tr><td style="padding:7px 5px;text-align:left;border-bottom:1px solid #ddd;"><a href="{{orgQueueUrl}}" style="color:#1155cc;text-decoration:underline;">機構參與申請</a></td><td style="padding:7px 5px;text-align:left;border-bottom:1px solid #ddd;">{{orgCount}} 件</td><td style="padding:7px 5px;text-align:left;border-bottom:1px solid #ddd;">{{orgWait}}</td></tr>
        <tr><td style="padding:7px 5px;text-align:left;border-bottom:1px solid #ddd;"><a href="{{wishQueueUrl}}" style="color:#1155cc;text-decoration:underline;">願望送審</a></td><td style="padding:7px 5px;text-align:left;border-bottom:1px solid #ddd;">{{wishCount}} 件</td><td style="padding:7px 5px;text-align:left;border-bottom:1px solid #ddd;">{{wishWait}}</td></tr>
        <tr><td style="padding:7px 5px;text-align:left;border-bottom:1px solid #ddd;"><a href="{{wishUnlockQueueUrl}}" style="color:#1155cc;text-decoration:underline;">願望解除凍結</a></td><td style="padding:7px 5px;text-align:left;border-bottom:1px solid #ddd;">{{wishUnlockCount}} 件</td><td style="padding:7px 5px;text-align:left;border-bottom:1px solid #ddd;">{{wishUnlockWait}}</td></tr>
        <tr><td style="padding:7px 5px;text-align:left;border-bottom:1px solid #ddd;"><a href="{{orgUnlockQueueUrl}}" style="color:#1155cc;text-decoration:underline;">機構解除停權</a></td><td style="padding:7px 5px;text-align:left;border-bottom:1px solid #ddd;">{{orgUnlockCount}} 件</td><td style="padding:7px 5px;text-align:left;border-bottom:1px solid #ddd;">{{orgUnlockWait}}</td></tr>
      </tbody></table>
      <p style="margin:0 0 16px;">謝謝您協助審核，讓等候中的機構早點收到回覆。</p>
      <p style="margin:0;">Best wishes,<br>線上聖誕老人團隊</p>
    </div>
  </template>

  <header>
    <small>4.8 管理員每日待審摘要｜信件預覽（使用虛構資料）</small>
    <h1 id="subject"></h1>
  </header>
  <main id="preview"></main>
  <p id="link-note" role="status"></p>
  <script>
    const example = {
      "totalCount": 8,
      "asOf": "2026/12/08 09:00",
      "orgCount": 2,
      "orgWait": "19 小時",
      "wishCount": 5,
      "wishWait": "1 天 2 小時",
      "wishUnlockCount": 1,
      "wishUnlockWait": "3 小時",
      "orgUnlockCount": 0,
      "orgUnlockWait": "—"
    };
    const fillExample = text => text.replace(/{{(\w+)}}/g, (token, key) => example[key] ?? token);
    document.getElementById('subject').textContent =
      fillExample(document.getElementById('email-subject').content.textContent);
    const preview = document.getElementById('email-body').content.cloneNode(true);
    for (const block of preview.querySelectorAll('[data-if]')) {
      const value = example[block.dataset.if];
      if (value == null || value === false || String(value).trim() === '') block.remove();
    }
    const walker = document.createTreeWalker(preview, NodeFilter.SHOW_TEXT);
    while (walker.nextNode()) walker.currentNode.textContent = fillExample(walker.currentNode.textContent);
    for (const link of preview.querySelectorAll('a')) {
      if (!link.getAttribute('href').startsWith('{{')) continue;
      link.href = '#link-note';
      link.addEventListener('click', event => {
        event.preventDefault();
        document.getElementById('link-note').textContent = '預覽使用虛構資料。正式信件會開啟「' + link.textContent + '」對應的網站頁面。';
      });
    }
    document.getElementById('preview').append(preview);
  </script>
</body>
</html>
