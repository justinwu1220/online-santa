<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>1.9 願望暫停寄送</title>
  <style>
    body { max-width: 760px; margin: 32px auto; padding: 0 20px; color: #222; font: 16px/1.65 Arial, "PingFang TC", sans-serif; }
    header { border-bottom: 1px solid #ddd; margin-bottom: 20px; padding-bottom: 14px; }
    header small, #link-note { color: #555; }
    h1 { margin: 6px 0 0; font-size: 20px; line-height: 1.5; }
  </style>
</head>
<body>
  <!-- 工程套用與欄位對照請見同資料夾 README.md。 -->
  <template id="email-subject">【線上聖誕老人 2026】請暫緩寄出您認領的「{{wishTitle}}」</template>
  <template id="email-body">
    <div lang="zh-Hant-TW" style="font-family:Arial,'PingFang TC','Microsoft JhengHei',sans-serif;font-size:16px;line-height:1.65;color:#222;">
      <p style="margin:0 0 16px;">親愛的{{recipientName}}，您好：</p>
      <p style="margin:0 0 12px;">您認領了「<strong>{{wishTitle}}</strong>」，我們正在確認這個願望的內容。<strong style="color:#a61c00;">這份禮物請先不要寄出。</strong>如果已經準備好了，也請先留在您手邊。</p>
      <p style="margin:0 0 16px;"><strong>暫停期間，寄送期限也會暫停計算。</strong>等願望恢復後，我們會再寄信告訴您新的寄送期限。</p>
      <p style="margin:0 0 16px;">如果您想詢問願望的細節，可以在認領頁留言給機構的夥伴。若想聯絡我們，也歡迎寫信到 <a href="mailto:onlinesanta2026@gmail.com" style="color:#1155cc;text-decoration:underline;">onlinesanta2026@gmail.com</a>。</p>
      <p style="margin:0 0 20px;"><a href="{{claimUrl}}" style="color:#1155cc;text-decoration:underline;">查看這筆認領與機構的對話</a></p>
      <p style="margin:0 0 20px;">謝謝您願意等我們確認，也謝謝您為孩子準備禮物的心意。</p>
      <p style="margin:0;">Best wishes,<br>線上聖誕老人團隊</p>
    </div>
  </template>

  <header>
    <small>1.9 願望暫停寄送｜信件預覽（使用虛構資料）</small>
    <h1 id="subject"></h1>
  </header>
  <main id="preview"></main>
  <p id="link-note" role="status"></p>
  <script>
    const example = {
      recipientName: '小晴',
      wishTitle: '一盒 48 色的色鉛筆'
    };
    const fillExample = text => text.replace(/{{(\w+)}}/g, (token, key) => example[key] ?? token);
    document.getElementById('subject').textContent =
      fillExample(document.getElementById('email-subject').content.textContent);
    const preview = document.getElementById('email-body').content.cloneNode(true);
    const walker = document.createTreeWalker(preview, NodeFilter.SHOW_TEXT);
    while (walker.nextNode()) walker.currentNode.textContent = fillExample(walker.currentNode.textContent);
    const link = preview.querySelector('a[href="{{claimUrl}}"]');
    link.href = '#link-note';
    link.addEventListener('click', event => {
      event.preventDefault();
      document.getElementById('link-note').textContent = '正式寄出時，這個連結會開啟收件人自己的這筆認領。';
    });
    document.getElementById('preview').append(preview);
  </script>
</body>
</html>
