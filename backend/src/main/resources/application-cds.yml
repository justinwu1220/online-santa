spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/cds_training
    username: cds
    password: cds
    hikari:
      # training run 不實際連線，避免啟動時卡住
      initialization-fail-timeout: -1
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        temp.use_jdbc_metadata_defaults: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
