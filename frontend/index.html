<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <style>html{background:#020617}</style>

    <!--
      搜尋引擎與社群分享用的標籤。

      這是 SPA，整站共用這一份 index.html，所以下面的 canonical 與 og 對每一條路徑都一樣。
      對首頁是正確的；其餘公開路徑不是 noindex（/wishes/，見 firebase.json）就是在
      robots.txt 裡 Disallow，所以可以接受。要讓每頁有自己的 meta 得上預渲染或 SSR。

      各頁的 document.title 由 src/lib/brand.ts 的 pageTitle() 在 useEffect 裡設定——
      Googlebot 執行 JS 所以讀得到，但不執行 JS 的社群爬蟲只會看到下面這組靜態的值。
      文案與 brand.ts 的 PLATFORM_NAME 重複，是因為靜態 HTML 沒辦法 import；改名時兩邊要一起改。

      沒有 og:image：專案裡沒有接近 1200×630 的素材。因此 twitter:card 用 summary，
      不是 summary_large_image（後者沒有圖會顯示成空白卡片）。

      標題、描述與網站圖示是《Google 搜尋上線與排名改善指南》（2026-11-13）的定稿，
      改文案要跟活動團隊確認。搜尋結果小圖旁的網站名稱來自最後那段 WebSite 結構化資料。
    -->
    <title>線上聖誕老人 × 社團法人彰化縣康乃心關懷協會 2026</title>
    <meta name="description" content="一份聖誕禮物，從一個願望開始。認識 2026 線上聖誕老人活動，了解如何認領身心障礙兒童、少年及成人的聖誕願望，親自準備禮物並寄到合作機構。" />
    <link rel="canonical" href="https://onlinesanta.org/" />
    <link rel="icon" type="image/png" sizes="128x128" href="/favicon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="線上聖誕老人" />
    <meta property="og:locale" content="zh_TW" />
    <meta property="og:url" content="https://onlinesanta.org/" />
    <meta property="og:title" content="線上聖誕老人 × 社團法人彰化縣康乃心關懷協會 2026" />
    <meta property="og:description" content="一份聖誕禮物，從一個願望開始。認識 2026 線上聖誕老人活動，了解如何認領身心障礙兒童、少年及成人的聖誕願望，親自準備禮物並寄到合作機構。" />
    <meta name="twitter:card" content="summary" />

    <!-- 搜尋結果小圖旁顯示的網站名稱 -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "線上聖誕老人",
        "url": "https://onlinesanta.org/"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
