name: CI · backend

on:
  workflow_dispatch:        # 允許手動觸發，方便驗證流水線
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/ci-backend.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/ci-backend.yml']

jobs:
  build:
    # 不用 ubuntu-latest：新版映像的 Docker 要求 API 1.40 以上，Testcontainers 1.21 連不上（改用 Testcontainers 2.x 後再放開）
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # verify 會一併跑 failsafe 的整合測試（*IT）。
      # Testcontainers 會自行啟動 PostgreSQL，不需要 service container。
      - name: Build and test
        run: mvn -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
