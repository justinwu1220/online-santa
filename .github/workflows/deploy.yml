name: Deploy

on:
  push:
    branches: [main]
  # 允許手動重新部署（例如只是想換一個環境變數）
  workflow_dispatch:

# 同一時間只跑一個部署，避免兩次 push 互相覆蓋
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  SERVICE_NAME: online-santa-api
  REGION: asia-east1
  REPOSITORY: online-santa

jobs:
  # 測試不通過就不部署。CI workflow 也會跑，但那是路徑過濾的，
  # 這裡要的是「這個 commit 的完整驗證」而非「有沒有動到後端」。
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: 後端測試
        run: mvn -B verify
        working-directory: backend

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 前端檢查
        run: npm ci && npm run lint && npm run build
        working-directory: frontend

  backend:
    needs: verify
    runs-on: ubuntu-latest
    # Workload Identity Federation 需要 OIDC token，不使用長期有效的 JSON 金鑰
    permissions:
      contents: read
      id-token: write
    outputs:
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - id: auth
        name: 取得 GCP 憑證（Workload Identity Federation）
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: 設定 Artifact Registry 認證
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: 建置並推送映像檔
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}
        run: |
          # 用 commit SHA 當標籤，任何一次部署都能對應回確切的原始碼；
          # latest 只是方便人工查看，部署時一律用 SHA
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" backend
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - id: deploy
        name: 部署到 Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          flags: >-
            --allow-unauthenticated
            --service-account=online-santa-run@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
            --cpu=1
            --memory=512Mi
            --concurrency=80
            --min-instances=0
            --max-instances=10
            --timeout=30s
            --cpu-boost
          env_vars: |
            SPRING_PROFILES_ACTIVE=prod
            FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID }}
            APP_ADMIN_EMAILS=${{ vars.APP_ADMIN_EMAILS }}
            APP_ALLOWED_ORIGINS=${{ vars.APP_ALLOWED_ORIGINS }}
            GCS_PUBLIC_BUCKET=${{ vars.GCS_PUBLIC_BUCKET }}
            WISH_IMAGE_ENABLED=${{ vars.WISH_IMAGE_ENABLED || 'false' }}
            GCS_PRIVATE_BUCKET=${{ vars.GCS_PRIVATE_BUCKET }}
            INTERNAL_JOB_AUDIENCE=${{ vars.INTERNAL_JOB_AUDIENCE }}
            SCHEDULER_SERVICE_ACCOUNT=${{ vars.SCHEDULER_SERVICE_ACCOUNT }}
          # 資料庫連線資訊放 Secret Manager，不進環境變數的明文設定
          secrets: |
            DB_URL=online-santa-db-url:latest
            DB_USERNAME=online-santa-db-username:latest
            DB_PASSWORD=online-santa-db-password:latest

      - name: 確認服務起得來
        run: |
          # Flyway 會在啟動時跑 migration，這一步同時驗證了資料庫連得上
          for attempt in $(seq 1 10); do
            if curl -fsS "${{ steps.deploy.outputs.url }}/actuator/health" | grep -q '"status":"UP"'; then
              echo "健康檢查通過"
              exit 0
            fi
            echo "第 $attempt 次尚未就緒，等待中…"
            sleep 6
          done
          echo "健康檢查失敗"
          exit 1

  frontend:
    needs: [verify, backend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 建置
        working-directory: frontend
        env:
          # Firebase 的 Web 設定本來就會出現在瀏覽器裡，不是秘密；
          # 真正的保護是 Firebase 的安全規則與後端的 token 驗證
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          # 前端與 API 不同網域，必須指定完整位址
          VITE_API_BASE_URL: ${{ needs.backend.outputs.url }}
          # 與後端的 WISH_IMAGE_ENABLED 一起開關。沒設就是關閉——願望牆改用分類圖示
          VITE_WISH_IMAGE_ENABLED: ${{ vars.WISH_IMAGE_ENABLED }}
        run: |
          npm ci
          npm run build

      - name: 取得 GCP 憑證
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          # firebase-tools 靠這個檔案認證，不需要長期有效的 CI token
          create_credentials_file: true
          export_environment_variables: true

      - name: 部署到 Firebase Hosting
        run: npx --yes firebase-tools@13 deploy --only hosting --project "${{ vars.FIREBASE_PROJECT_ID }}" --non-interactive
