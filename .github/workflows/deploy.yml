name: Deploy

# push 到 main：測試 → 建一次映像檔 → 部署到測試站 → 等人核准 → 用同一個映像檔部署正式站。
#
# 測試站驗證過的就是上正式站的東西：映像檔只建一次，兩個環境部署的是同一個 commit SHA 的映像檔。
# 正式站在核准之前完全不會被動到（GitHub 的 production Environment 設了「必須核准」）。
# 部署步驟寫在 _deploy.yml，兩個環境共用。

on:
  push:
    branches: [main]
  # 允許手動重新部署（例如只是想換一個環境變數）
  workflow_dispatch:

# 並行限制放在 _deploy.yml 的部署 job（每個環境各自一個群組），不放在整個 workflow 上：
# 整個 workflow 共用一個群組的話，停在「等待核准」的正式站 run 會一直佔著位子，之後的 push
# 連測試站都部署不了。現在的行為：
#   - 測試站：每次 push 都部署。前一次還在部署就排隊，排隊中的同一時間只保留最新一個。
#   - 正式站：只在核准後才動；核准時若這個版本已不是 main 最新，會直接失敗（見 _deploy.yml），
#     請改核准最新的那個 run。

env:
  REGION: asia-east1
  REPOSITORY: online-santa
  # 映像檔名稱沿用「正式服務名稱」，兩個環境共用同一個映像檔倉庫
  IMAGE_NAME: online-santa-api

jobs:
  # 測試不通過就不部署。CI workflow 也會跑，但那是路徑過濾的，
  # 這裡要的是「這個 commit 的完整驗證」而非「有沒有動到後端」。
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: 後端測試
        run: mvn -B verify
        working-directory: backend

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 前端檢查
        run: npm ci && npm run lint && npm test && npm run build
        working-directory: frontend

  # 映像檔只在這裡建一次
  build-image:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - name: 取得 GCP 憑證（Workload Identity Federation）
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: 設定 Artifact Registry 認證
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - id: meta
        name: 決定映像檔名稱
        run: echo "image=${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"

      - name: 建置並推送映像檔
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          # 用 commit SHA 當標籤，任何一次部署都能對應回確切的原始碼；
          # latest 只是方便人工查看，部署時一律用 SHA
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" backend
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  staging:
    needs: build-image
    # 被呼叫的 _deploy.yml 要用 Workload Identity（id-token: write）。呼叫端必須授予相同或更大的權限，
    # 否則 GitHub 會在啟動階段就拒絕整個 workflow（startup_failure），連一個 job 都不會跑
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: staging
      image: ${{ needs.build-image.outputs.image }}:${{ github.sha }}
    secrets: inherit

  # 部署到正式站之前，GitHub 會停下來等 production Environment 設定的核准者按「Approve」
  production:
    # needs 只包含直接依賴：要讀 build-image 的輸出，必須明確列出來
    needs: [build-image, staging]
    # 被呼叫的 _deploy.yml 要用 Workload Identity（id-token: write）。呼叫端必須授予相同或更大的權限，
    # 否則 GitHub 會在啟動階段就拒絕整個 workflow（startup_failure），連一個 job 都不會跑
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: production
      image: ${{ needs.build-image.outputs.image }}:${{ github.sha }}
    secrets: inherit
